<!--
  Configuration partagée du groupe "default"
  Emplacement sur le manager : /var/ossec/etc/shared/default/agent.conf
  Poussée automatiquement à tous les agents du groupe.

  Collecte le canal Sysmon des hôtes Windows (télémétrie EDR :
  création de processus, réseau, DNS, DLL...).
-->
<agent_config>
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
